<style>

<body><main class="wrap">
<header><div><h1>拆毛线啊！</h1><p>三股绳结 · 固定绳尾</p></div><button id="help" type="button">怎么玩</button></header>
<div class="stage"><canvas id="board" aria-label="可拖动的立体三股绳结"></canvas><p id="view-note">拖空白转动 · 拖线头或线身</p></div>
<section class="panel" aria-label="抓取位置">
<div class="row" id="picks">
<button data-pick="tip" class="red">A 线头</button><button data-pick="body" class="red">A 线身</button><button data-pick="loop" class="green">B 圈边</button><button data-pick="cross" class="blue">C 压线</button>
</div>
<p id="feedback" role="status">沿着珊瑚色 A 看一看，它是从哪一面穿过绿圈的？</p>
<div class="row"><button id="hint" aria-pressed="false">拉向提示</button><button id="reset-view">复位视角</button><button id="reset">重打这个结</button></div>
</section>
<footer><a href="./">返回毛线团</a><span id="result">A 仍穿在圈里</span></footer>
</main>
<dialog id="instructions"><h2>解开这枚结</h2><p>直接拖线条，或先点下方的线头、线身、圈边、压线，画布会标出抓取位置。拖空白转动绳结。</p><p>手感卡住时，试着把线往结里送。观察绿圈和蓝线哪里接触，再想办法腾出能让线头通过的空间。手指在当前屏幕平面内拖动，想往深处送线时，先把结转到侧面。小铜钉固定了绳尾。</p><form method="dialog"><button>回来试试</button></form></dialog>
<script>
'use strict';
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const add=(a,b)=>a.map((v,i)=>v+b[i]);
const mul=(a,n)=>a.map(v=>v*n);
const dot=(a,b)=>a.reduce((s,v,i)=>s+v*b[i],0);
const sub=(a,b)=>add(a,mul(b,-1));
const unit=a=>mul(a,1/(Math.hypot(...a)||1));
// Distances use the same world units as the rendered rope radius.
const cordRadius=.075, headRadius=cordRadius;
const skin=.015, diameter=cordRadius*2;
const len=a=>Math.hypot(...a);
const lerp=(a,b,t)=>add(a,mul(sub(b,a),t));
function sample(points,step=.195){
  const out=[points[0]];
  let carry=0;
  for(let i=1;i<points.length;i++){
    let a=points[i-1], b=points[i], remaining=len(sub(b,a));
    while(remaining+carry>=step){
      a=lerp(a,b,(step-carry)/remaining);
      out.push(a);remaining=len(sub(b,a));carry=0;
    }
    carry+=remaining;
  }
  if(carry>step*.58)out.push(points.at(-1));else out[out.length-1]=points.at(-1);
  return out;
}
function fresh(){
  const ring=Array.from({length:41},(_,i)=>{
    const theta=-Math.PI/2+i*Math.PI/20;
    return [.43*Math.cos(theta),.46*Math.sin(theta),-.13+.26*i/40];
  });
  const paths={
    A:spline([[-1.69,-.81,-.82],[-.95,-.83,-.80],[-.61,-.63,-.87],[.04,-.52,-.61],[.24,-.31,-.40],[.255,-.10,-.13],[.24,.035,.18],[.31,.11,.52],[.45,.20,.79]]),
    B:[[-1.6,-.74,-.32],[-.79,-.63,-.24],...ring,[.82,-.65,.24],[1.60,-.79,.30]],
    C:spline([[-1.59,.57,-.21],[-.93,.36,.21],[-.53,.13,.45],[-.15,-.04,.53],[.30,-.05,.53],[.80,.18,.36],[1.58,.53,-.17]])
  };
  const ropes=Object.entries(paths).map(([id,path])=>{
    const p=sample(path), weights=p.map((_,i)=>i===0 || (id!=='A'&&i===p.length-1)?0:1);
    return {id,p,weights,rest:p.slice(1).map((x,i)=>len(sub(x,p[i])))};
  });
  const s={ropes,segments:[],eye:[],escaped:false,metrics:{maxOverlap:0,rejected:0,maxStretch:0,contacts:0}};
  for(const r of ropes)for(let i=0;i<r.p.length-1;i++)s.segments.push({r,i});
  const green=ropes[1].p;
  for(let i=0;i<green.length;i++)if(Math.abs(green[i][0])<.55&&green[i][1]>-.54)s.eye.push(i);
  for(let i=0;i<70;i++)solve(s,null,null,null);
  if(overlap(s)>1e-4)throw Error('Initial ropes overlap');
  return s;
}
function closest(a,b,c,d){
  const u=sub(b,a),v=sub(d,c),w=sub(a,c),aa=dot(u,u),bb=dot(u,v),cc=dot(v,v);
  const dd=dot(u,w),ee=dot(v,w),det=aa*cc-bb*bb;
  let t=det>1e-12?clamp((bb*ee-cc*dd)/det,0,1):0;
  let q=clamp((bb*t+ee)/Math.max(cc,1e-12),0,1);
  t=clamp((bb*q-dd)/Math.max(aa,1e-12),0,1);
  return [t,q,sub(lerp(a,b,t),lerp(c,d,q))];
}
function visit(s,limit,contact){
  const segments=s.segments;
  for(let j=0;j<segments.length;j++)for(let k=j+1;k<segments.length;k++){
    const {r:a,i}=segments[j],{r:b,i:h}=segments[k];
    if(a===b&&h-i<2)continue;
    const p=a.p[i],q=a.p[i+1],u=b.p[h],v=b.p[h+1];
    let near=true;
    for(let n=0;n<3;n++)if(Math.min(p[n],q[n])-Math.max(u[n],v[n])>limit || Math.min(u[n],v[n])-Math.max(p[n],q[n])>limit){near=false;break;}
    if(!near)continue;
    const [t,jt,delta]=closest(p,q,u,v),distance=len(delta);
    if(distance<limit)contact(a,i,b,h,t,jt,delta,distance);
  }
}
function overlap(s){
  let worst=0;
  visit(s,diameter,(a,i,b,j,t,u,n,d)=>{worst=Math.max(worst,diameter-d);});
  return worst;
}
// For each nearby pair, bound the distance over the entire substep.
// The distance between moving capsules is Lipschitz in their relative endpoint motion.
function clearSweep(s,old,end){
  const records=s.segments.map(({r,i})=>{
    const strand=s.ropes.indexOf(r),a=old[strand][i],b=old[strand][i+1],
      c=end[strand][i],d=end[strand][i+1];
    const low=a.map((_,k)=>Math.min(a[k],b[k],c[k],d[k]));
    const high=a.map((_,k)=>Math.max(a[k],b[k],c[k],d[k]));
    return {r,i,a,b,c,d,low,high,da:sub(c,a),db:sub(d,b)};
  });
  for(let j=0;j<records.length;j++)for(let k=j+1;k<records.length;k++){
    const a=records[j],b=records[k];
    if(a.r===b.r&&b.i-a.i<2)continue;
    if(a.low.some((v,i)=>v-b.high[i]>diameter||b.low[i]-a.high[i]>diameter))continue;
    const speed=Math.max(...[a.da,a.db].flatMap(x=>[b.da,b.db].map(y=>len(sub(x,y)))));
    function separated(from,to,depth){
      const t=(from+to)*.5;
      const distance=len(closest(lerp(a.a,a.c,t),lerp(a.b,a.d,t),lerp(b.a,b.c,t),lerp(b.b,b.d,t))[2]);
      if(distance-speed*(to-from)*.5>=diameter-1e-4)return true;
      if(distance<diameter-1e-4||depth===6)return false;
      return separated(from,t,depth+1)&&separated(t,to,depth+1);
    }
    if(!separated(0,1,0))return false;
  }
  return true;
}
function solve(s,grab,target,previous){
  for(const r of s.ropes){
    for(let j=0;j<r.rest.length;j++){
      const i=r.rest.length-1-j, p=r.p[i],q=r.p[i+1],delta=sub(q,p), d=len(delta);
      const wa=r.weights[i],wb=r.weights[i+1];
      if(d<1e-9||wa+wb===0)continue;
      const n=mul(delta,(d-r.rest[i])/(d*(wa+wb)));
      r.p[i]=add(p,mul(n,wa));r.p[i+1]=sub(q,mul(n,wb));
    }
  }
  if(grab){
    const {r,i,t}=grab,a=r.p[i],b=r.p[i+1];
    const u=1-t,v=t,inv=r.weights[i]*u*u+r.weights[i+1]*v*v;
    if(inv>0){
      const delta=mul(sub(target,lerp(a,b,t)),.42/inv);
      r.p[i]=add(a,mul(delta,r.weights[i]*u));r.p[i+1]=add(b,mul(delta,r.weights[i+1]*v));
    }
  }
  visit(s,diameter+skin,(a,i,b,j,t,u,delta,d)=>{
    const ca=[1-t,t],cb=[1-u,u];
    const wa=ca.map((v,k)=>v*a.weights[i+k]),wb=cb.map((v,k)=>v*b.weights[j+k]);
    const inv=dot(wa,ca)+dot(wb,cb);
    if(inv===0||d<1e-9)return;
    const n=mul(delta,1/d), depth=diameter+skin-d;
    let correction=mul(n,depth/inv);
    if(previous){
      const oldA=previous[s.ropes.indexOf(a)],oldB=previous[s.ropes.indexOf(b)];
      const motion=sub(delta,sub(lerp(oldA[i],oldA[i+1],t),lerp(oldB[j],oldB[j+1],u)));
      const tangent=sub(motion,mul(n,dot(motion,n))),slip=len(tangent);
      if(slip>1e-8)correction=sub(correction,mul(tangent,Math.min(.32*depth/slip,.45)/inv));
    }
    for(let k=0;k<2;k++){
      a.p[i+k]=add(a.p[i+k],mul(correction,wa[k]));
      b.p[j+k]=sub(b.p[j+k],mul(correction,wb[k]));
    }
    if(a!==b)s.metrics.contacts++;
  });
}
function poseOf(grab){return lerp(grab.r.p[grab.i],grab.r.p[grab.i+1],grab.t);}
function advanceGrab(s,grab,to){
  const from=poseOf(grab),delta=sub(to,from),n=Math.min(10,Math.ceil(len(delta)/.021));
  for(let k=0;k<n;k++){
    const old=s.ropes.map(r=>r.p.slice());
    const current=poseOf(grab),direction=sub(to,current),length=len(direction);
    const target=add(current,mul(direction,Math.min(1,.021/Math.max(length,1e-10))));
    for(let i=0;i<18;i++)solve(s,grab,target,i<4?old:null);
    const end=s.ropes.map(r=>r.p);
    const stretch=Math.max(...s.ropes.flatMap(r=>r.rest.map((length,i)=>Math.abs(len(sub(r.p[i],r.p[i+1]))/length-1))));
    const penetration=overlap(s);
    const jump=Math.max(...end.flatMap((points,i)=>points.map((p,j)=>len(sub(old[i][j],p)))));
    if(penetration>1e-4 || stretch>.065 || jump>.046 || !clearSweep(s,old,end)){
      s.ropes.forEach((r,i)=>r.p=old[i]);s.metrics.rejected++;break;
    }
    s.ropes.forEach((r,i)=>r.p=end[i]);
    s.metrics.maxOverlap=Math.max(s.metrics.maxOverlap,penetration);
    s.metrics.maxStretch=Math.max(s.metrics.maxStretch,stretch);
  }
  s.escaped=isClear(s);
}
function isClear(s){
  const [a,b]=s.ropes, ring=s.eye.map(i=>b.p[i]);
  const mid=mul(ring.reduce(add),1/ring.length),tip=a.p.at(-1);
  if(tip[2]>mid[2]-.24)return false;
  for(let j=0;j<a.p.length-1;j++){
    const origin=a.p[j],dir=sub(a.p[j+1],origin);
    for(let i=0;i<ring.length;i++){
      const edge=sub(ring[i],mid),next=sub(ring[(i+1)%ring.length],mid);
      const cross=(x,y)=>[x[1]*y[2]-x[2]*y[1],x[2]*y[0]-x[0]*y[2],x[0]*y[1]-x[1]*y[0]];
      const h=cross(dir,next),det=dot(edge,h);
      if(Math.abs(det)<1e-8)continue;
      const v=sub(origin,mid),u=dot(v,h)/det,q=cross(v,edge),w=dot(dir,q)/det,d=dot(next,q)/det;
      if(u>=0&&w>=0&&u+w<=1&&d>=0&&d<=1)return false;
    }
  }
  return true;
}
function choice(s,id){
  const r=s.ropes[{tip:0,body:0,loop:1,cross:2}[id]];
  const i=id==='tip'?r.p.length-2:id==='body'?Math.floor(r.p.length*.45):id==='loop'?s.eye[Math.floor(s.eye.length*.25)]:Math.floor(r.p.length*.5);
  return {r,i:Math.min(i,r.p.length-2),t:id==='tip'?1:.5,id};
}
function geometry(s){
  return {strands:Object.fromEntries(s.ropes.map(r=>[r.id,r.p])),
    handles:Object.fromEntries(Object.keys(labels).map(id=>[id,poseOf(choice(s,id))]))};
}
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const colors={A:['#743a2c','#b96549','#efac82'],B:['#374b3c','#658367','#b1c7a0'],C:['#304954','#547b8a','#9ec3cf']};
const labels={tip:'A 头',body:'A 身',loop:'B 圈',cross:'C 压'};
const axes={tip:[-.83,-.24,-.70],body:[0,.35,-.35],loop:[1,.20,0],cross:[0,1,.04]};
const advice={tip:'把 A 线头朝圈里推。',body:'从圈后抓住 A 的线身，斜向上送，让它重新弯出一截松线。',loop:'朝外拉 B 的圈边，让圈口变大。',cross:'沿圈面抬开 C 的压线。'};
let state=fresh(), yaw=.79,pitch=.25,w=0,h=0,scale=1,marks=[],hit=[],grip=null,selected=null,hints=false,paint=0;

function camera(){const a=Math.sin(yaw),b=Math.cos(yaw),c=Math.sin(pitch),d=Math.cos(pitch);return [[b,0,-a],[-a*c,d,-b*c],[a*d,c,b*d]];}
function project(p,basis){return [w*.5+scale*dot(p,basis[0]),h*.48-scale*dot(p,basis[1]),dot(p,basis[2])];}
function spline(points){
  const result=[];
  for(let i=0;i<points.length-1;i++){
    const a=points[Math.max(0,i-1)],b=points[i],c=points[i+1],d=points[Math.min(i+2,points.length-1)];
    for(let j=0;j<10;j++){
      const t=j/10;
      result.push(b.map((v,k)=>.5*(2*v+(-a[k]+c[k])*t+(2*a[k]-5*v+4*c[k]-d[k])*t*t+(-a[k]+3*v-3*c[k]+d[k])*t*t*t)));
    }
  }
  return result.concat([points.at(-1)]);
}
function line(a,b,width,color){
  ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);
  ctx.lineWidth=width;ctx.strokeStyle=color;ctx.stroke();
}
function invalidate(){if(!paint)paint=requestAnimationFrame(draw);}
function draw(){
  paint=0;
  const {strands,handles}=geometry(state),basis=camera(),segments=[];
  ctx.clearRect(0,0,w,h);
  const light=ctx.createRadialGradient(w*.35,h*.29,5,w*.5,h*.43,Math.max(w,h)*.75);
  light.addColorStop(0,'#f8efdb');light.addColorStop(1,'#d0bfa2');ctx.fillStyle=light;ctx.fillRect(0,0,w,h);
  ctx.lineCap='round';
  for(const [id,points] of Object.entries(strands)){
    const p=points.map(q=>project(q,basis));
    for(let i=1;i<p.length;i++)segments.push({id,a:p[i-1],b:p[i],i,z:(p[i-1][2]+p[i][2])*.5});
  }
  {
    const p=project(handles.tip,basis); segments.push({id:'A',a:p,b:[p[0]+.01,p[1],p[2]],i:0,z:p[2],head:true});
  }
  for(const rope of state.ropes)for(let i=0;i<rope.p.length;i++){
    if(rope.weights[i])continue;
    const [x,y]=project(rope.p[i],basis);
    ctx.beginPath();ctx.arc(x,y,7,0,Math.PI*2);ctx.fillStyle='#66523a';ctx.fill();
    ctx.beginPath();ctx.arc(x-1,y-1,4.5,0,Math.PI*2);ctx.fillStyle='#c5a471';ctx.fill();
  }
  hit=segments.sort((a,b)=>a.z-b.z);

    const [dark,base,lit]=colors[id], width=Math.max(5,scale*(head?headRadius:cordRadius)*2);
    line(a,b,width+2,dark);line(a,b,width-1,base);
    line([a[0]-.8,a[1]-1.8],[b[0]-.8,b[1]-1.8],width*.51,lit);
    if(i%2===0){
      const v=unit([b[0]-a[0],b[1]-a[1]]);
      const x=(a[0]+b[0])*.5,y=(a[1]+b[1])*.5;
      line([x-v[0]*2-v[1]*width*.33,y-v[1]*2+v[0]*width*.33],

    }
  }
  marks=[];
  {
    const order=selected?[selected]:['tip','body','loop','cross'];
    for(const id of order){
      const p=project(handles[id],basis), offset={tip:[-27,-23],body:[-18,26],loop:[30,-13],cross:[20,26]}[id];
      const x=clamp(p[0]+offset[0],24,w-24),y=clamp(p[1]+offset[1],24,h-24);
      marks.push({id,x,y,p});
      line(p,[x,y],1,'#544635');
      ctx.beginPath();ctx.roundRect(x-20,y-12,40,24,8);ctx.fillStyle='#fff8e9';ctx.fill();
      ctx.strokeStyle='#75644e';ctx.lineWidth=1;ctx.stroke();
      ctx.font='bold 12px system-ui';ctx.textBaseline='middle';ctx.textAlign='center';ctx.fillStyle='#352c20';ctx.fillText(labels[id],x,y);
      if(hints&&id===selected){
        const dir=project(add(handles[id],axes[id]),basis);
        const d=unit(sub(dir.slice(0,2),p.slice(0,2)));
        const a=[x,y-15],b=add(a,mul(d,34));
        line(a,b,3,'#3b5745');
        for(const side of [-1,1])line(b,add(sub(b,mul(d,9)),mul([-d[1],d[0]],side*5)),3,'#3b5745');
      }
    }
  }
}
function resize(){
  const box=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  w=box.width;h=box.height;scale=Math.min(w/4.45,h/3.65);
  canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);
  invalidate();
}
function select(id){
  selected=id;
  for(const b of document.querySelectorAll('[data-pick]'))b.setAttribute('aria-pressed',String(b.dataset.pick===id));
  if(hints&&id)$('feedback').textContent=advice[id];
  invalidate();
}
function nearest(x,y){
  const label=marks.filter(m=>Math.hypot(x-m.x,y-m.y)<23).sort((a,b)=>Math.hypot(x-a.x,y-a.y)-Math.hypot(x-b.x,y-b.y))[0];
  if(label)return choice(state,label.id);
  for(const s of [...hit].reverse()){
    const a=s.a.slice(0,2),d=sub(s.b.slice(0,2),a),v=sub([x,y],a);
    if(Math.hypot(...sub(v,mul(d,clamp(dot(v,d)/(dot(d,d)||1),0,1))))<10){
      if(s.head)return choice(state,'tip');
      const r=state.ropes.find(r=>r.id===s.id);
      const t=clamp(dot(v,d)/(dot(d,d)||1),0,1);
      return {r,i:s.i-1,t,id:s.id==='A'?'body':s.id==='B'?'loop':'cross'};
    }
  }
  return null;
}
canvas.addEventListener('pointerdown',e=>{
  if(grip||e.button!==0)return;
  const box=canvas.getBoundingClientRect(), x=e.clientX-box.left,y=e.clientY-box.top;
  const grab=nearest(x,y);
  grip={pointer:e.pointerId,grab,target:grab&&poseOf(grab),x:e.clientX,y:e.clientY};
  canvas.setPointerCapture(e.pointerId);
  if(grab)select(grab.id);
});
canvas.addEventListener('pointermove',e=>{
  if(grip?.pointer!==e.pointerId)return;
  const dx=e.clientX-grip.x,dy=e.clientY-grip.y;
  grip.x=e.clientX;grip.y=e.clientY;
  if(!grip.grab){yaw+=dx*.009;pitch=clamp(pitch+dy*.008,-1.35,1.35);invalidate();return;}
  const [right,up]=camera();
  grip.target=add(grip.target,mul(sub(mul(right,dx),mul(up,dy)),1/scale));
  advanceGrab(state,grip.grab,grip.target);
  // Clamp the spring lag so a blocked gesture does not bank force.
  const present=poseOf(grip.grab),lag=sub(grip.target,present);
  if(len(lag)>.10)grip.target=add(present,mul(unit(lag),.10));
  $('result').textContent=state.escaped?'绳结已解开':'A 仍穿在圈里';
  const text=len(lag)>.052?'线被别的线段抵住了。试着送线，或从另一面拉开压住它的线。':
    '可以松手换一段抓，拖空白转动视角。';
  if($('feedback').textContent!==text)$('feedback').textContent=text;
  invalidate();
});
for(const name of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(name,e=>{
  if(grip?.pointer===e.pointerId){grip=null;invalidate();}
});
for(const b of document.querySelectorAll('[data-pick]'))b.onclick=()=>{
  const id=b.dataset.pick;
  select(id);
  const [right,up]=camera();
  if(Math.hypot(dot(right,axes[id]),dot(up,axes[id]))<.50){yaw=.79;pitch=.25;invalidate();}
};
$('hint').onclick=()=>{hints=!hints;$('hint').setAttribute('aria-pressed',hints);if(hints&&!selected)select('body');else if(hints)$('feedback').textContent=advice[selected];invalidate();};
$('reset-view').onclick=()=>{yaw=.79;pitch=.25;invalidate();};
$('reset').onclick=()=>{state=fresh();grip=null;hints=false;$('hint').setAttribute('aria-pressed','false');select(null);$('reset-view').click();$('result').textContent='A 仍穿在圈里';$('feedback').textContent='沿着珊瑚色 A 看一看，它是从哪一面穿过绿圈的？';};
$('help').onclick=()=>$('instructions').showModal();
new ResizeObserver(resize).observe(canvas);
resize();
</script></body></html>
